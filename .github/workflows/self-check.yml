name: Self-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm test

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run this repo's own Action against itself
        uses: ./
        with:
          path: '.'
          ignore: 'test'

  action-failing-case:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run against test/ (known high-severity fixtures), expect the job step to fail
        id: should_fail
        uses: ./
        continue-on-error: true
        with:
          path: 'test'
      - name: Assert the previous step actually failed
        if: steps.should_fail.outcome != 'failure'
        run: |
          echo "Expected a high-severity finding in test/ to fail the step, but outcome was '${{ steps.should_fail.outcome }}'." >&2
          exit 1
      - name: Same fixtures with fail-on-high=false, expect success
        id: should_pass
        uses: ./
        with:
          path: 'test'
          fail-on-high: 'false'
